[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "article2pod"
version = "0.1.0"
description = "文章→播客 零成本流水线：把公众号长文变成双人对话播客"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml",
    "edge-tts",
]

[project.optional-dependencies]
# 只有 `article2pod fetch <url>` 用得到，刻意不进主 dependencies：
# 不抓 URL 的人不该被迫装一个正文抽取库。
fetch = ["trafilatura>=1.12"]

[project.scripts]
article2pod = "article2pod.cli:main"

[tool.pytest.ini_options]
# 必须钉死：裸跑 pytest 会扫到 demo/cosyvoice_demo（6.7G 第三方模型仓库，已 gitignore），
# 里面自带 test_*.py，一收集就 ImportError 炸掉整个测试会话。
testpaths = ["tests"]

[tool.ruff]
# 显式钉死规则集：不写这段，ruff 会往上找/用用户级配置，CI 与本地结果不一致。
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 + F = ruff 默认集：抓真错（未定义、未使用、语法级问题），不做风格洁癖。
# 本项目大量 `except Exception` 是有意的兜底（TTS/网络都要吞异常后降级），
# 所以不开 BLE/S/TRY/PLW 这类会与「失败要吵但链路要跑完」打架的规则。
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = { "" = "src" }
# gui 必须显式列出：写 ["article2pod"] 时子包不会进 wheel，装完 python -m article2pod.gui 直接 ModuleNotFoundError
packages = ["article2pod", "article2pod.gui"]

[tool.setuptools.package-data]
"article2pod.gui" = ["*.html", "*.js", "*.css"]
